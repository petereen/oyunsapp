<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting to OYUNS ALL-IN-ONE</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
      }

      .card {
        width: min(92vw, 420px);
        background: #ffffff;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        text-align: center;
      }

      a {
        color: #0284c7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Returning to the app…</h1>
      <p>If nothing happens automatically, tap the link below.</p>
      <p><a id="fallback-link" href="mn.oyuns.app://telegram-auth">Open OYUNS ALL-IN-ONE</a></p>
    </div>
    <script>
      (function () {
        const appUrl = new URL("mn.oyuns.app://telegram-auth");
        const params = new URLSearchParams(window.location.search);
        appUrl.search = params.toString();
        const finalUrl = appUrl.toString();
        const fallbackLink = document.getElementById("fallback-link");
        if (fallbackLink) {
          fallbackLink.href = finalUrl;
        }
        window.location.replace(finalUrl);
      })();
    </script>
  </body>
</html>
